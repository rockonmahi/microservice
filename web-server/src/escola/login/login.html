<div class="login-container">
    <div *ngIf="!name">
        <h2>Please Login</h2>
        <button (click)="login()">Login with Auth Server</button>
    </div>

    <div *ngIf="name">
        <h2>Welcome, {{ name }}!</h2>
        <p>You are successfully logged in.</p>

        <div class="claims" *ngIf="identityClaims">
            <h3>Your Identity Claims:</h3>
            <pre>{{ identityClaims | json }}</pre>
        </div>

        <button (click)="logout()">Logout</button>
    </div>
</div>
