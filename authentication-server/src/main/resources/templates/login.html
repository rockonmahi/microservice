<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Authentication Server</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #172033;
        }
        .card {
            width: min(420px, calc(100% - 32px));
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, .12);
        }
        .brand { text-align: center; margin-bottom: 30px; }
        .brand-icon {
            width: 54px; height: 54px; margin: 0 auto 16px;
            border-radius: 14px; background: #2563eb; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700;
        }
        h1 { margin: 0 0 8px; font-size: 26px; }
        .subtitle { margin: 0; color: #64748b; font-size: 14px; }
        .alert {
            padding: 12px 14px; border-radius: 9px; margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 600; }
        input {
            width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1;
            border-radius: 9px; font-size: 15px; outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
        button {
            width: 100%; border: 0; border-radius: 9px; padding: 13px 16px;
            background: #2563eb; color: white; font-size: 15px; font-weight: 700;
            cursor: pointer; margin-top: 4px;
        }
        button:hover { background: #1d4ed8; }
        .footer { margin-top: 24px; text-align: center; color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">
        <div class="brand-icon">A</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to the Authentication Server</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password. Please try again.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been successfully signed out.
    </div>

    <!-- Spring Security's existing validation handles this POST. -->
    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" placeholder="Enter your username" required autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Enter your password" required>
        </div>

        <button type="submit">Sign in</button>
    </form>

    <div class="footer">Authentication Server</div>
</main>
</body>
</html>
